name: Проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Типы, тесты, сборка
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Типы
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Сборка панели
        run: npm run build

      - name: Секретов в репозитории быть не должно
        run: |
          if git ls-files | grep -qE '^\.env$'; then
            echo 'Файл .env закоммичен — так нельзя.' >&2
            exit 1
          fi
          # Токен бота выглядит как 8-10 цифр, двоеточие и 35 символов.
          if git grep -nIE '[0-9]{8,10}:[A-Za-z0-9_-]{35}' -- . ':!*.md' ':!.github/*'; then
            echo 'Похоже на токен бота в коде.' >&2
            exit 1
          fi
          echo 'Чисто.'

  docker:
    name: Сборка образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker build
        run: docker build -t somoni-tracker:ci .
