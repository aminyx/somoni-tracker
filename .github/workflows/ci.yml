name: Проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Типы, тесты, сборка
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Типы
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Команды из README действительно работают
        run: |
          # db:migrate однажды молча ничего не делал на Windows: проверка
          # определения «файл запущен напрямую» была сломана. Пусть падает тут,
          # а не у судьи.
          DATABASE_PATH=./ci-check.db npm run db:migrate
          node -e "
            const D = require('better-sqlite3');
            const t = new D('./ci-check.db')
              .prepare(\"select name from sqlite_master where type='table'\")
              .all().map(r => r.name);
            const need = ['users','expenses','sessions','auth_tokens','limits','category_overrides','rates'];
            const missing = need.filter(n => !t.includes(n));
            if (missing.length) { console.error('нет таблиц:', missing.join(', ')); process.exit(1); }
            console.log('таблиц создано:', t.length);
          "
          rm -f ./ci-check.db*

      - name: Сборка панели
        run: npm run build

      - name: Секретов в репозитории быть не должно
        run: |
          if git ls-files | grep -qE '^\.env$'; then
            echo 'Файл .env закоммичен — так нельзя.' >&2
            exit 1
          fi
          # Токен бота выглядит как 8-10 цифр, двоеточие и 35 символов.
          if git grep -nIE '[0-9]{8,10}:[A-Za-z0-9_-]{35}' -- . ':!*.md' ':!.github/*' ':!.env.example'; then
            echo 'Похоже на токен бота в коде.' >&2
            exit 1
          fi
          echo 'Чисто.'

  docker:
    name: Сборка образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker build
        run: docker build -t somoni-tracker:ci .
